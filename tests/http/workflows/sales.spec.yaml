version: "1.1"
name: Sales API
components:
  schemas:
    Sale:
      $ref: ./src/openapi.json#/components/schemas/Sale
    FacilitoError:
      $ref: ./src/openapi.json#/components/schemas/FacilitoError
    Product:
      $ref: ./src/openapi.json#/components/schemas/Product
    ProductPaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/ProductPaginationResponse
    Customer:
      $ref: ./src/openapi.json#/components/schemas/Customer
    Merchant:
      $ref: ./src/openapi.json#/components/schemas/Merchant
config:
  concurrency: 1
before:
  name: provisions the sales resources through the HTTP API
  steps:
    - name: checks whether onboarding is required
      http:
        url: ${{env.baseUrl}}/v1/products
        method: GET
        auth:
          bearer:
            token: ${{env.token}}
        check:
          status:
            - match: ^(200|403)$
          schema:
            anyOf:
              - $ref: "#/components/schemas/ProductPaginationResponse"
              - allOf:
                  - $ref: "#/components/schemas/FacilitoError"
                  - type: object
                    properties:
                      code:
                        const: account_not_provisioned
                      status:
                        const: 403
        captures:
          membershipError:
            jsonpath: $.code
    - name: completes onboarding when required
      http:
        url: ${{env.baseUrl}}/v1/onboarding
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
          country: ni
          location:
            name: Water 7
            business_type: electronics_store
        check:
          status: 200
          schema:
            $ref: "#/components/schemas/Merchant"
      if: captures.membershipError == "account_not_provisioned"
    - name: creates an item to obtain the provisioned location
      http:
        url: ${{env.baseUrl}}/v1/products
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Mandarins
          price: "100.00"
          unit_cost: "50.00"
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Product"
          jsonpath:
            $.product_type: item
            $.variants.length: 1
            $.variants[0].inventory_levels.length: 1
        captures:
          itemVariantId:
            jsonpath: $.variants[0].id
          locationId:
            jsonpath: $.variants[0].inventory_levels[0].location_id
    - name: creates an active service variant for checkout
      http:
        url: ${{env.baseUrl}}/v1/products
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: "Chopper's consultation"
          price: "20.00"
          product_type: service
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Product"
          jsonpath:
            $.product_type: service
            $.status: active
            $.variants.length: 1
        captures:
          serviceVariantId:
            jsonpath: $.variants[0].id
    - name: creates a customer for checkout
      http:
        url: ${{env.baseUrl}}/v1/customers
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Customer"
        captures:
          customerId:
            jsonpath: $.id
tests:
  checkout:
    name: records service checkouts and exposes validation through the HTTP contract
    steps:
      - name: records a service sale with a server-generated ID and client UTC business date
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: &auth
            bearer:
              token: ${{env.token}}
          json: &checkout
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T12:30:00-06:00"
            customer_id: ${{captures.customerId}}
            notes: "  Provisions for the Sunny  "
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "10.00"
              - method: cash
                amount: "10.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.id:
                - match: ^sale_.+$
              $.status: fulfilled
              $.source: pos.web
              $.transaction_number: 1
              $.business_date: "2026-10-10T18:30:00.000Z"
              $.notes: Provisions for the Sunny
              $.customer.id: ${{captures.customerId}}
              $.line_items.length: 1
              $.payments.length: 2
      - name: rejects invalid decimal text as a client error
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            discount_rate: not-a-decimal
          check:
            status: 400
            jsonpath:
              $.code: validation_error
      - name: rejects an empty line item list as invalid input
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            line_items: []
            payments: []
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: rejects an underpayment with payment_insufficient
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            payments:
              - method: cash
                amount: "19.99"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: payment_insufficient
              $.status: 400
      - name: rejects an overpayment with validation_error
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            payments:
              - method: cash
                amount: "20.01"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: rejects a positive total with no payments
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            payments: []
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: payment_insufficient
              $.status: 400
      - name: rejects duplicate variants in one sale
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "40.00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: rejects a missing customer
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            customer_id: AAAAAAAAAAAAAAAAAAAAAAAA
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: resource_not_found
              $.status: 404
      - name: rejects a missing variant
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            line_items:
              - variant_id: BBBBBBBBBBBBBBBBBBBBBBBB
                price: "20.00"
                quantity: 1
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: resource_not_found
              $.status: 404
      - name: requires authentication
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          json: *checkout
          check:
            status: 401
            jsonpath:
              $.code: invalid_oauth_token
      - name: allows an owner a free service without payment or inventory
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T18:30:00Z"
            discount_rate: "1.00"
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments: []
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.transaction_number: 2
              $.payments.length: 0
      - name: rejects a business date without a timezone
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            business_date: "2026-10-10T12:30:00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: rejects a draft item through the sale HTTP contract
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            line_items:
              - variant_id: ${{captures.itemVariantId}}
                price: "100.00"
                quantity: 2
            payments:
              - method: cash
                amount: "200.00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
              $.message: Only active products and unarchived variants can be sold.
              $.status: 400
      - name: rejects a missing checkout location
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            location_id: CCCCCCCCCCCCCCCCCCCCCCCC
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: resource_not_found
              $.message: The location has not been found.
              $.status: 404
      - name: rejects a discount greater than the whole sale value
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            discount_rate: "1.01"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: records an Android service sale without consuming numbers for rejected requests
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            source: pos.android
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.source: pos.android
              $.transaction_number: 3
              $.line_items[0].shortage_quantity: 0
      - name: records an iOS service sale with the next number
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            source: pos.ios
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.source: pos.ios
              $.transaction_number: 4
              $.line_items[0].shortage_quantity: 0
      - name: accepts exact payment after an owner discount and persists its rate
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            discount_rate: "0.50"
            payments:
              - method: cash
                amount: "10.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.transaction_number: 5
              $.discount_rate: "0.50"
              $.line_items[0].price: "20.00"
              $.payments.length: 1
              $.payments[0].amount: "10.00"
      - name: creates a service sale for the void endpoint contract
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T18:30:00Z"
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "20.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.payments.length: 1
          captures:
            voidSaleId:
              jsonpath: $.id
      - name: rejects unauthenticated void requests
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          json: {}
          check:
            status: 401
      - name: rejects a non-string void reason at the HTTP boundary
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          auth: *auth
          json:
            reason: 75
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: returns not found for an unknown sale
        http:
          url: ${{env.baseUrl}}/v1/sales/sale_missing/void
          method: POST
          auth: *auth
          json: {}
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: resource_not_found
      - name: trims and records the void reason and returns the original payment
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          auth: *auth
          json:
            reason: "  Voided at the counter  "
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: Voided at the counter
              $.voided_by.name: Monkey D. Luffy
              $.voided_at:
                - match: ^\d{4}-\d{2}-\d{2}T
              $.payments.length: 1
              $.payments[0].amount: "20.00"
      - name: keeps the first void reason when a repeated request supplies a blank reason
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          auth: *auth
          json:
            reason: "   "
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: Voided at the counter
              $.payments.length: 1
      - name: returns the original voided sale when the request has no body
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          auth: *auth
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: Voided at the counter
      - name: creates another sale for an omitted void reason
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T18:30:00Z"
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "20.00"
          check:
            status: 201
          captures:
            noReasonSaleId:
              jsonpath: $.id
      - name: voids without a body and returns a null reason
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.noReasonSaleId}}/void
          method: POST
          auth: *auth
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: null
      - name: creates a sale for a whitespace-only void reason
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T18:30:00Z"
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "20.00"
          check:
            status: 201
          captures:
            blankReasonSaleId:
              jsonpath: $.id
      - name: voids a sale with a whitespace-only reason and returns a null reason
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.blankReasonSaleId}}/void
          method: POST
          auth: *auth
          json:
            reason: "   "
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: null
