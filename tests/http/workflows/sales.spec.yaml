version: "1.1"
name: Sales API
components:
  schemas:
    Sale:
      $ref: ./src/openapi.json#/components/schemas/Sale
    SalePaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/SalePaginationResponse
    MipymeError:
      $ref: ./src/openapi.json#/components/schemas/MipymeError
    Product:
      $ref: ./src/openapi.json#/components/schemas/Product
    ProductPaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/ProductPaginationResponse
    Customer:
      $ref: ./src/openapi.json#/components/schemas/Customer
    Merchant:
      $ref: ./src/openapi.json#/components/schemas/Merchant
config:
  concurrency: 1
before:
  name: provisions the sales resources through the HTTP API
  steps:
    - name: checks whether onboarding is required
      http:
        url: ${{env.baseUrl}}/v1/products
        method: GET
        auth:
          bearer:
            token: ${{env.token}}
        check:
          status:
            - match: ^(200|403)$
          schema:
            anyOf:
              - $ref: "#/components/schemas/ProductPaginationResponse"
              - allOf:
                  - $ref: "#/components/schemas/MipymeError"
                  - type: object
                    properties:
                      code:
                        const: account_not_provisioned
                      status:
                        const: 403
        captures:
          membershipError:
            jsonpath: $.code
    - name: completes onboarding when required
      http:
        url: ${{env.baseUrl}}/v1/onboarding
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
          country: ni
          location:
            name: Water 7
            business_type: electronics_store
        check:
          status: 200
          schema:
            $ref: "#/components/schemas/Merchant"
      if: captures.membershipError == "account_not_provisioned"
    - name: creates an item to obtain the provisioned location
      http:
        url: ${{env.baseUrl}}/v1/products
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Mandarins
          price: "100.00"
          unit_cost: "50.00"
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Product"
          jsonpath:
            $.product_type: item
            $.variants.length: 1
            $.variants[0].inventory_levels.length:
              - gt: 0
        captures:
          itemVariantId:
            jsonpath: $.variants[0].id
          locationId:
            jsonpath: $.variants[0].inventory_levels[0].location_id
    - name: creates an active service variant for checkout
      http:
        url: ${{env.baseUrl}}/v1/products
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: "Chopper's consultation"
          price: "20.00"
          product_type: service
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Product"
          jsonpath:
            $.product_type: service
            $.status: active
            $.variants.length: 1
        captures:
          serviceVariantId:
            jsonpath: $.variants[0].id
    - name: creates a customer for checkout
      http:
        url: ${{env.baseUrl}}/v1/customers
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Customer"
        captures:
          customerId:
            jsonpath: $.id
    - name: prepares pending sale data
      plugin:
        id: ${{env.workflowFixtureDirectory}}/sales.fixture.ts
        params:
          action: setup
tests:
  checkout:
    name: records service checkouts and exposes validation through the HTTP contract
    steps:
      - name: records a service sale with a server-generated ID and client UTC business date
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: &auth
            bearer:
              token: ${{env.token}}
          json: &checkout
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T12:30:00-06:00"
            customer_id: ${{captures.customerId}}
            notes: "  Provisions for the Sunny  "
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "10.00"
              - method: cash
                amount: "10.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.id:
                - match: ^sale_.+$
              $.status: fulfilled
              $.source: pos.web
              $.transaction_number: 1
              $.business_date: "2026-10-10T18:30:00.000Z"
              $.notes: Provisions for the Sunny
              $.customer.id: ${{captures.customerId}}
              $.line_items.length: 1
              $.payments.length: 2
          captures:
            readSaleId:
              jsonpath: $.id
            readSaleBody:
              body: true
      - name: retrieves the complete sale through the detail endpoint
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.readSaleId}}
          method: GET
          auth: *auth
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            body:
              - eq: ${{captures.readSaleBody}}
      - name: lists full sales using snake case filters and inclusive business dates
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: GET
          auth: *auth
          params:
            limit: 1
            location_id: ${{captures.locationId}}
            customer_id: ${{captures.customerId}}
            status: fulfilled
            from: "2026-10-10T12:30:00-06:00"
            to: "2026-10-10T18:30:00Z"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/SalePaginationResponse"
            jsonpath:
              $.results.length: 1
              $.results[0].id: ${{captures.readSaleId}}
              $.results[0].line_items.length: 1
              $.results[0].payments.length: 2
              $.results[0].customer.id: ${{captures.customerId}}
              $.next_cursor: null
              $.has_more: false
      - name: returns no sales when the business date lower bound is after the saved timestamp by a microsecond
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: GET
          auth: *auth
          params:
            from: "2026-10-10T18:30:00.000001Z"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/SalePaginationResponse"
            jsonpath:
              $.results.length: 0
              $.next_cursor: null
              $.has_more: false
      - name: applies the status filter even when the merchant has a sale
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: GET
          auth: *auth
          params:
            status: voided
          check:
            status: 200
            jsonpath:
              $.results.length: 0
      - name: applies the snake case customer filter
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: GET
          auth: *auth
          params:
            customer_id: cust_0000000000000000000
          check:
            status: 200
            jsonpath:
              $.results.length: 0
      - name: rejects invalid decimal text as a client error
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            discount_rate: not-a-decimal
          check:
            status: 400
            jsonpath:
              $.code: validation_error
      - name: rejects an empty line item list as invalid input
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            line_items: []
            payments: []
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: rejects an underpayment with payment_insufficient
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            payments:
              - method: cash
                amount: "19.99"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: payment_insufficient
              $.status: 400
      - name: rejects an overpayment with validation_error
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            payments:
              - method: cash
                amount: "20.01"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: rejects a positive total with no payments
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            payments: []
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: payment_insufficient
              $.status: 400
      - name: rejects duplicate variants in one sale
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "40.00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: rejects a missing customer
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            customer_id: AAAAAAAAAAAAAAAAAAAAAAAA
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: resource_not_found
              $.status: 404
      - name: rejects a missing variant
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            line_items:
              - variant_id: BBBBBBBBBBBBBBBBBBBBBBBB
                price: "20.00"
                quantity: 1
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: resource_not_found
              $.status: 404
      - name: requires authentication
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          json: *checkout
          check:
            status: 401
            jsonpath:
              $.code: invalid_oauth_token
      - name: allows an owner a free service without payment or inventory
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T18:30:00Z"
            discount_rate: "1.00"
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments: []
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.transaction_number: 2
              $.payments.length: 0
      - name: rejects a business date without a timezone
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            business_date: "2026-10-10T12:30:00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: rejects a draft item through the sale HTTP contract
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            line_items:
              - variant_id: ${{captures.itemVariantId}}
                price: "100.00"
                quantity: 2
            payments:
              - method: cash
                amount: "200.00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
              $.message: Only active products and unarchived variants can be sold.
              $.status: 400
      - name: rejects a missing checkout location
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            location_id: CCCCCCCCCCCCCCCCCCCCCCCC
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: resource_not_found
              $.message: The location has not been found.
              $.status: 404
      - name: rejects a discount greater than the whole sale value
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            discount_rate: "1.01"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
              $.status: 400
      - name: records an Android service sale without consuming numbers for rejected requests
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            source: pos.android
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.source: pos.android
              $.transaction_number: 3
              $.line_items[0].shortage_quantity: 0
      - name: records an iOS service sale with the next number
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            source: pos.ios
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.source: pos.ios
              $.transaction_number: 4
              $.line_items[0].shortage_quantity: 0
      - name: accepts exact payment after an owner discount and persists its rate
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            discount_rate: "0.50"
            payments:
              - method: cash
                amount: "10.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.transaction_number: 5
              $.discount_rate: "0.50"
              $.line_items[0].price: "20.00"
              $.payments.length: 1
              $.payments[0].amount: "10.00"
      - name: creates a service sale for the void endpoint contract
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T18:30:00Z"
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "20.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.payments.length: 1
          captures:
            voidSaleId:
              jsonpath: $.id
      - name: rejects unauthenticated void requests
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          json: {}
          check:
            status: 401
      - name: rejects a non-string void reason at the HTTP boundary
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          auth: *auth
          json:
            reason: 75
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: returns not found for an unknown sale
        http:
          url: ${{env.baseUrl}}/v1/sales/sale_missing/void
          method: POST
          auth: *auth
          json: {}
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: resource_not_found
      - name: trims and records the void reason and returns the original payment
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          auth: *auth
          json:
            reason: "  Voided at the counter  "
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: Voided at the counter
              $.voided_by.name: Monkey D. Luffy
              $.voided_at:
                - match: ^\d{4}-\d{2}-\d{2}T
              $.payments.length: 1
              $.payments[0].amount: "20.00"
      - name: keeps the first void reason when a repeated request supplies a blank reason
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          auth: *auth
          json:
            reason: "   "
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: Voided at the counter
              $.payments.length: 1
      - name: returns the original voided sale when the request has no body
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.voidSaleId}}/void
          method: POST
          auth: *auth
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: Voided at the counter
      - name: creates another sale for an omitted void reason
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T18:30:00Z"
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "20.00"
          check:
            status: 201
          captures:
            noReasonSaleId:
              jsonpath: $.id
      - name: voids without a body and returns a null reason
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.noReasonSaleId}}/void
          method: POST
          auth: *auth
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: null
      - name: creates a sale for a whitespace-only void reason
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T18:30:00Z"
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "20.00"
          check:
            status: 201
          captures:
            blankReasonSaleId:
              jsonpath: $.id
      - name: voids a sale with a whitespace-only reason and returns a null reason
        http:
          url: ${{env.baseUrl}}/v1/sales/${{captures.blankReasonSaleId}}/void
          method: POST
          auth: *auth
          json:
            reason: "   "
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: voided
              $.void_reason: null
  read_validation:
    name: rejects invalid sale read requests and requires authentication
    steps:
      - name: rejects invalid limits
        http:
          url: ${{env.baseUrl}}/v1/sales?limit=101
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects zero limits
        http:
          url: ${{env.baseUrl}}/v1/sales?limit=0
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects invalid status
        http:
          url: ${{env.baseUrl}}/v1/sales?status=refunded
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects invalid location identifiers
        http:
          url: ${{env.baseUrl}}/v1/sales?location_id=Water7
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects invalid customer identifiers
        http:
          url: ${{env.baseUrl}}/v1/sales?customer_id=Luffy
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects malformed cursors
        http:
          url: ${{env.baseUrl}}/v1/sales?cursor=not-a-cursor
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects timestamps without a timezone
        http:
          url: ${{env.baseUrl}}/v1/sales?from=2026-10-10T18:30:00
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects invalid calendar dates
        http:
          url: ${{env.baseUrl}}/v1/sales?from=2026-02-30T00:00:00Z
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects reversed date ranges
        http:
          url: ${{env.baseUrl}}/v1/sales?from=2026-10-11T00:00:00Z&to=2026-10-10T00:00:00Z
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects invalid sale ID
        http:
          url: ${{env.baseUrl}}/v1/sales/not-an-id
          method: GET
          auth: *auth
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: rejects missing sale
        http:
          url: ${{env.baseUrl}}/v1/sales/sale_0000000000000000000
          method: GET
          auth: *auth
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: resource_not_found
      - name: rejects unauthenticated detail
        http:
          url: ${{env.baseUrl}}/v1/sales/sale_0000000000000000000
          method: GET
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: invalid_oauth_token
      - name: rejects unauthenticated list
        http:
          url: ${{env.baseUrl}}/v1/sales/
          method: GET
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: invalid_oauth_token
      - name: rejects reversed ranges that differ only in fractional milliseconds
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: GET
          auth: *auth
          params:
            from: "2026-10-10T18:30:00.000900Z"
            to: "2026-10-10T18:30:00.000100Z"
          check:
            status: 400
            jsonpath:
              $.code: validation_error
  pendingCheckout:
    name: records paid pending sales and preserves stock across POS sources
    steps:
      - name: records a web backorder with only the stock deficit
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json: &pendingCheckout
            source: pos.web
            location_id: ${{captures.webLocationId}}
            business_date: "2026-10-10T18:30:00Z"
            line_items:
              - variant_id: ${{captures.pendingVariantId}}
                price: "100.00"
                quantity: 5
            payments:
              - method: cash
                amount: "500.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: pending
              $.source: pos.web
              $.transaction_number: 42
              $.location_id: ${{captures.webLocationId}}
              $.line_items.length: 1
              $.line_items[0].variant_id: ${{captures.pendingVariantId}}
              $.line_items[0].quantity: 5
              $.line_items[0].shortage_quantity: 3
              $.payments.length: 1
              $.payments[0].method: cash
              $.payments[0].amount: "500.00"
      - name: rejects web shortages at a location with backorders disabled
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *pendingCheckout
            location_id: ${{captures.mobileLocationId}}
          check:
            status: 409
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: stock_insufficient
              $.status: 409
              $.details.length: 1
              $.details[0].code: stock_insufficient
      - name: records an Android shortage despite disabled backorders
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *pendingCheckout
            source: pos.android
            location_id: ${{captures.mobileLocationId}}
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: pending
              $.source: pos.android
              $.transaction_number: 42
              $.location_id: ${{captures.mobileLocationId}}
              $.line_items[0].shortage_quantity: 3
              $.payments[0].amount: "500.00"
      - name: records an iOS shortage without reserving stock from the Android sale
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *pendingCheckout
            source: pos.ios
            location_id: ${{captures.mobileLocationId}}
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: pending
              $.source: pos.ios
              $.transaction_number: 43
              $.line_items[0].shortage_quantity: 3
              $.payments[0].amount: "500.00"
after:
  name: verifies and removes pending sale data
  steps:
    - name: verifies the pending sale fixture
      plugin:
        id: ${{env.workflowFixtureDirectory}}/sales.fixture.ts
        params:
          action: cleanup
