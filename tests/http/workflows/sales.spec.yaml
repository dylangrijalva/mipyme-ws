version: "1.1"
name: Sales API
components:
  schemas:
    Sale:
      $ref: ./src/openapi.json#/components/schemas/Sale
    FacilitoError:
      $ref: ./src/openapi.json#/components/schemas/FacilitoError
    Product:
      $ref: ./src/openapi.json#/components/schemas/Product
    ProductPaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/ProductPaginationResponse
    Customer:
      $ref: ./src/openapi.json#/components/schemas/Customer
    Merchant:
      $ref: ./src/openapi.json#/components/schemas/Merchant
config:
  concurrency: 1
before:
  name: provisions the sales resources through the HTTP API
  steps:
    - name: checks whether onboarding is required
      http:
        url: ${{env.baseUrl}}/v1/products
        method: GET
        auth:
          bearer:
            token: ${{env.token}}
        check:
          status:
            - match: ^(200|403)$
          schema:
            anyOf:
              - $ref: "#/components/schemas/ProductPaginationResponse"
              - allOf:
                  - $ref: "#/components/schemas/FacilitoError"
                  - type: object
                    properties:
                      code:
                        const: account_not_provisioned
                      status:
                        const: 403
        captures:
          membershipError:
            jsonpath: $.code
    - name: completes onboarding when required
      http:
        url: ${{env.baseUrl}}/v1/onboarding
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
          country: ni
          location:
            name: Water 7
            business_type: electronics_store
        check:
          status: 200
          schema:
            $ref: "#/components/schemas/Merchant"
      if: captures.membershipError == "account_not_provisioned"
    - name: creates an item to obtain the provisioned location
      http:
        url: ${{env.baseUrl}}/v1/products
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Mandarins
          price: "100.00"
          unit_cost: "50.00"
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Product"
          jsonpath:
            $.product_type: item
            $.variants.length: 1
            $.variants[0].inventory_levels.length: 1
        captures:
          locationId:
            jsonpath: $.variants[0].inventory_levels[0].location_id
    - name: creates an active service variant for checkout
      http:
        url: ${{env.baseUrl}}/v1/products
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: "Chopper's consultation"
          price: "20.00"
          product_type: service
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Product"
          jsonpath:
            $.product_type: service
            $.status: active
            $.variants.length: 1
        captures:
          serviceVariantId:
            jsonpath: $.variants[0].id
    - name: creates a customer for checkout
      http:
        url: ${{env.baseUrl}}/v1/customers
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Customer"
        captures:
          customerId:
            jsonpath: $.id
tests:
  checkout:
    name: records service checkouts and exposes validation through the HTTP contract
    steps:
      - name: records a service sale with a server-generated ID and client UTC business date
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: &auth
            bearer:
              token: ${{env.token}}
          json: &checkout
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T12:30:00-06:00"
            customer_id: ${{captures.customerId}}
            notes: "  Provisions for the Sunny  "
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments:
              - method: cash
                amount: "10.00"
              - method: cash
                amount: "10.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.id:
                - match: ^sale_.+$
              $.status: fulfilled
              $.source: pos.web
              $.transaction_number: 1
              $.business_date: "2026-10-10T18:30:00.000Z"
              $.notes: Provisions for the Sunny
              $.customer.id: ${{captures.customerId}}
              $.line_items.length: 1
              $.payments.length: 2
      - name: rejects invalid decimal text as a client error
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            <<: *checkout
            discount_rate: not-a-decimal
          check:
            status: 400
            jsonpath:
              $.code: validation_error
      - name: requires authentication
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          json: *checkout
          check:
            status: 401
            jsonpath:
              $.code: invalid_oauth_token
      - name: allows an owner a free service without payment or inventory
        http:
          url: ${{env.baseUrl}}/v1/sales
          method: POST
          auth: *auth
          json:
            location_id: ${{captures.locationId}}
            business_date: "2026-10-10T18:30:00Z"
            discount_rate: "1.00"
            line_items:
              - variant_id: ${{captures.serviceVariantId}}
                price: "20.00"
                quantity: 1
            payments: []
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Sale"
            jsonpath:
              $.status: fulfilled
              $.transaction_number: 2
              $.payments.length: 0
