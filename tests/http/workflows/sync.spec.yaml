version: "1.1"
name: Sync API
components:
  schemas:
    SyncResponse:
      $ref: ./src/openapi.json#/components/schemas/SyncResponse
    MipymeError:
      $ref: ./src/openapi.json#/components/schemas/MipymeError
    Merchant:
      $ref: ./src/openapi.json#/components/schemas/Merchant
    ProductPaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/ProductPaginationResponse
config:
  concurrency: 1
before:
  name: provisions the authenticated account
  steps:
    - name: checks whether onboarding is required
      http:
        url: ${{env.baseUrl}}/v1/products
        method: GET
        auth:
          bearer:
            token: ${{env.token}}
        check:
          status:
            - match: ^(200|403)$
          schema:
            anyOf:
              - $ref: "#/components/schemas/ProductPaginationResponse"
              - allOf:
                  - $ref: "#/components/schemas/MipymeError"
                  - type: object
                    properties:
                      code:
                        const: account_not_provisioned
                      status:
                        const: 403
        captures:
          membershipError:
            jsonpath: $.code
    - name: completes onboarding
      http:
        url: ${{env.baseUrl}}/v1/onboarding
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
          country: ni
          location:
            name: Merry's Shop
            business_type: electronics_store
        check:
          status: 200
          schema:
            $ref: "#/components/schemas/Merchant"
      if: captures.membershipError == "account_not_provisioned"
tests:
  lifecycle:
    name: downloads full and incremental merchant resources
    steps:
      - name: creates a collection to sync
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Grand Line sync provisions
          check:
            status: 201
          captures:
            collectionId:
              jsonpath: $.id
      - name: creates a customer to sync
        http:
          url: ${{env.baseUrl}}/v1/customers
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Nico Robin at Water 7
          check:
            status: 201
          captures:
            customerId:
              jsonpath: $.id
      - name: creates a supplier to sync
        http:
          url: ${{env.baseUrl}}/v1/suppliers
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Sanji sync provisions
          check:
            status: 201
          captures:
            supplierId:
              jsonpath: $.id
      - name: creates a product to sync
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Nami's sync mandarins
            price: "20.00"
            unit_cost: "10.00"
            collection_id: ${{captures.collectionId}}
          check:
            status: 201
          captures:
            productId:
              jsonpath: $.id
            variantId:
              jsonpath: $.variants[0].id
      - name: returns all resources using snake_case and standard read representations
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: "*"
          check:
            status: 200
            headers:
              Cache-Control: no-store
            schema:
              $ref: "#/components/schemas/SyncResponse"
            jsonpath:
              $.full_sync:
                - eq: true
              $.products[?(@.name == "Nami's sync mandarins")].unit_cost:
                - eq:
                    - "10.00"
              $.products[?(@.name == "Nami's sync mandarins")].variants[0].id:
                - eq:
                    - ${{captures.variantId}}
              $.collections[?(@.name == "Grand Line sync provisions")].name:
                - eq:
                    - Grand Line sync provisions
              $.customers[?(@.name == "Nico Robin at Water 7")].name:
                - eq:
                    - Nico Robin at Water 7
              $.suppliers[?(@.name == "Sanji sync provisions")].name:
                - eq:
                    - Sanji sync provisions
              $.locations.length:
                - gt: 0
              $.employees[?(@.is_owner == true)].name:
                - eq:
                    - Monkey D. Luffy
              $.employees[?(@.is_owner == true)].location_ids.length:
                - gte: 0
              $.merchant.id:
                - match: ^merch_[A-Z0-9]+$
          captures:
            checkpoint:
              jsonpath: $.sync_token
      - name: replays recently created resources inside the one-hour overlap
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: ${{captures.checkpoint}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/SyncResponse"
            jsonpath:
              $.full_sync:
                - eq: false
              $.products[?(@.name == "Nami's sync mandarins")].id:
                - eq:
                    - ${{captures.productId}}
              $.products[?(@.name == "Nami's sync mandarins")].price:
                - eq:
                    - "20.00"
              $.products[?(@.name == "Nami's sync mandarins")].unit_cost:
                - eq:
                    - "10.00"
              $.products[?(@.name == "Nami's sync mandarins")].variants[0].id:
                - eq:
                    - ${{captures.variantId}}
              $.collections[?(@.name == "Grand Line sync provisions")].id:
                - eq:
                    - ${{captures.collectionId}}
              $.customers[?(@.name == "Nico Robin at Water 7")].id:
                - eq:
                    - ${{captures.customerId}}
              $.suppliers[?(@.name == "Sanji sync provisions")].id:
                - eq:
                    - ${{captures.supplierId}}
      - name: updates the saved product
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.productId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            price: "25.00"
          check:
            status: 200
      - name: returns the complete updated product with resources inside the overlap
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: ${{captures.checkpoint}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/SyncResponse"
            jsonpath:
              $.full_sync:
                - eq: false
              $.products[?(@.name == "Nami's sync mandarins")].id:
                - eq:
                    - ${{captures.productId}}
              $.products[?(@.name == "Nami's sync mandarins")].price:
                - eq:
                    - "25.00"
              $.products[?(@.name == "Nami's sync mandarins")].unit_cost:
                - eq:
                    - "10.00"
              $.products[?(@.name == "Nami's sync mandarins")].variants[0].id:
                - eq:
                    - ${{captures.variantId}}
              $.collections[?(@.name == "Grand Line sync provisions")].id:
                - eq:
                    - ${{captures.collectionId}}
              $.customers[?(@.name == "Nico Robin at Water 7")].id:
                - eq:
                    - ${{captures.customerId}}
              $.suppliers[?(@.name == "Sanji sync provisions")].id:
                - eq:
                    - ${{captures.supplierId}}
          captures:
            updatedCheckpoint:
              jsonpath: $.sync_token
      - name: reuses an earlier token after newer tokens have been issued
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: ${{captures.checkpoint}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/SyncResponse"
            jsonpath:
              $.full_sync:
                - eq: false
              $.products[?(@.name == "Nami's sync mandarins")].id:
                - eq:
                    - ${{captures.productId}}
              $.products[?(@.name == "Nami's sync mandarins")].price:
                - eq:
                    - "25.00"
              $.products[?(@.name == "Nami's sync mandarins")].unit_cost:
                - eq:
                    - "10.00"
              $.products[?(@.name == "Nami's sync mandarins")].variants[0].id:
                - eq:
                    - ${{captures.variantId}}
              $.collections[?(@.name == "Grand Line sync provisions")].id:
                - eq:
                    - ${{captures.collectionId}}
              $.customers[?(@.name == "Nico Robin at Water 7")].id:
                - eq:
                    - ${{captures.customerId}}
              $.suppliers[?(@.name == "Sanji sync provisions")].id:
                - eq:
                    - ${{captures.supplierId}}
      - name: accepts the fresh checkpoint and safely replays recent records
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: ${{captures.updatedCheckpoint}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/SyncResponse"
            jsonpath:
              $.full_sync:
                - eq: false
              $.products[?(@.name == "Nami's sync mandarins")].id:
                - eq:
                    - ${{captures.productId}}
              $.products[?(@.name == "Nami's sync mandarins")].price:
                - eq:
                    - "25.00"
              $.products[?(@.name == "Nami's sync mandarins")].unit_cost:
                - eq:
                    - "10.00"
              $.products[?(@.name == "Nami's sync mandarins")].variants[0].id:
                - eq:
                    - ${{captures.variantId}}
              $.collections[?(@.name == "Grand Line sync provisions")].id:
                - eq:
                    - ${{captures.collectionId}}
              $.customers[?(@.name == "Nico Robin at Water 7")].id:
                - eq:
                    - ${{captures.customerId}}
              $.suppliers[?(@.name == "Sanji sync provisions")].id:
                - eq:
                    - ${{captures.supplierId}}
  validation:
    name: rejects invalid JSON sync contracts
    steps:
      - name: rejects a missing token
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json: {}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects a null token
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: null
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects a numeric token
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: 42
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects an empty token
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: ""
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects a malformed token
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: not-a-sync-token
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: sync_token_invalid
      - name: rejects an oversized token
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            sync_token: 
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
  authentication:
    name: requires authentication
    steps:
      - name: requires bearer authentication
        http:
          url: ${{env.baseUrl}}/v1/sync
          method: POST
          json:
            sync_token: "*"
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
