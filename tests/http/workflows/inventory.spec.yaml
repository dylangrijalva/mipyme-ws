version: "1.1"
name: Inventory API
components:
  schemas:
    Product:
      $ref: ./src/openapi.json#/components/schemas/Product
    ProductPaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/ProductPaginationResponse
    InventoryAdjustments:
      $ref: ./src/openapi.json#/components/schemas/InventoryAdjustments
    InventoryChangePaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/InventoryChangePaginationResponse
    MipymeError:
      $ref: ./src/openapi.json#/components/schemas/MipymeError
    Merchant:
      $ref: ./src/openapi.json#/components/schemas/Merchant
config:
  concurrency: 1
before:
  name: provisions the authenticated account and its products
  steps:
    - name: checks whether onboarding is required
      http:
        url: ${{env.baseUrl}}/v1/products
        method: GET
        auth:
          bearer:
            token: ${{env.token}}
        check:
          status:
            - match: ^(200|403)$
          schema:
            anyOf:
              - $ref: "#/components/schemas/ProductPaginationResponse"
              - allOf:
                  - $ref: "#/components/schemas/MipymeError"
                  - type: object
                    properties:
                      code:
                        const: account_not_provisioned
                      status:
                        const: 403
        captures:
          membershipError:
            jsonpath: $.code
    - name: completes onboarding
      http:
        url: ${{env.baseUrl}}/v1/onboarding
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
          phone: "+50588881234"
          pin: "1234"
          location:
            name: Merry's Shop
            business_type: electronics_store
        check:
          status: 200
          schema:
            $ref: "#/components/schemas/Merchant"
      if: captures.membershipError == "account_not_provisioned"
    - name: captures the onboarding location
      http:
        url: ${{env.baseUrl}}/v1/locations
        method: GET
        auth:
          bearer:
            token: ${{env.token}}
        check:
          status: 200
        captures:
          locationId:
            jsonpath: $.results[0].id
    - name: creates an item with opening stock
      http:
        url: ${{env.baseUrl}}/v1/products
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Nami's tangerines
          price: "5.00"
          unit_cost: "2.00"
          inventory_levels:
            - location_id: ${{captures.locationId}}
              on_hand: 12
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Product"
        captures:
          tangerinesId:
            jsonpath: $.id
          tangerinesVariantId:
            jsonpath: $.variants[0].id
    - name: creates an item without opening stock
      http:
        url: ${{env.baseUrl}}/v1/products
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Usopp's tabasco stars
          price: "4.00"
          unit_cost: "1.00"
        check:
          status: 201
          schema:
            $ref: "#/components/schemas/Product"
        captures:
          tabascoId:
            jsonpath: $.id
          tabascoVariantId:
            jsonpath: $.variants[0].id
tests:
  adjustments:
    name: adjusts stock after the opening stock and lists its history
    steps:
      - name: records damaged stock with snake_case fields and trimmed notes
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          headers:
            Idempotency-Key: tangerines-water-leak
          json:
            location_id: ${{captures.locationId}}
            line_items:
              - variant_id: ${{captures.tangerinesVariantId}}
                reason: damaged
                quantity_delta: -3
                notes: "  Water leak  "
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/InventoryAdjustments"
            jsonpath:
              $.movements.length:
                - eq: 1
              $.movements[0].variant_id:
                - eq: ${{captures.tangerinesVariantId}}
              $.movements[0].location_id:
                - eq: ${{captures.locationId}}
              $.movements[0].reason:
                - eq: damaged
              $.movements[0].from_state:
                - eq: in_stock
              $.movements[0].to_state:
                - eq: waste
              $.movements[0].quantity_delta:
                - eq: -3
              $.movements[0].unit_cost:
                - eq: "2.00"
              $.movements[0].notes:
                - eq: Water leak
              $.movements[0].reference_id:
                - eq: null
              $.inventory_levels.length:
                - eq: 1
              $.inventory_levels[0].on_hand:
                - eq: 9
              $.inventory_levels[0].stock_status:
                - eq: in_stock
          captures:
            waterLeak:
              body: true
            waterLeakMovementId:
              jsonpath: $.movements[0].id
      - name: replays the same adjustment for a repeated idempotency key without applying it twice
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          headers:
            Idempotency-Key: tangerines-water-leak
          json:
            location_id: ${{captures.locationId}}
            line_items:
              - variant_id: ${{captures.tangerinesVariantId}}
                reason: damaged
                quantity_delta: -3
                notes: "  Water leak  "
          check:
            status: 201
            body:
              - eq: ${{captures.waterLeak}}
      - name: corrects a miscount upwards
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.locationId}}
            line_items:
              - variant_id: ${{captures.tangerinesVariantId}}
                reason: correction
                quantity_delta: 2
                notes: Found a crate behind the counter
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/InventoryAdjustments"
            jsonpath:
              $.movements[0].from_state:
                - eq: none
              $.movements[0].to_state:
                - eq: in_stock
              $.inventory_levels[0].on_hand:
                - eq: 11
          captures:
            correctionMovementId:
              jsonpath: $.movements[0].id
      - name: persists the adjusted stock on the product
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.tangerinesId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.unit_cost:
                - eq: "2.00"
              $.variants[0].inventory_levels[?(@.on_hand > 0)].location_id:
                - eq:
                    - ${{captures.locationId}}
              $.variants[0].inventory_levels[?(@.on_hand > 0)].on_hand:
                - eq:
                    - 11
          captures:
            tangerinesAfterAdjustments:
              body: true
      - name: rejects a correction with blank notes
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.locationId}}
            line_items:
              - variant_id: ${{captures.tangerinesVariantId}}
                reason: correction
                quantity_delta: -1
                notes: "   "
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.details[0].field:
                - eq: lineItems.0.notes
      - name: rejects damage that adds stock
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.locationId}}
            line_items:
              - variant_id: ${{captures.tangerinesVariantId}}
                reason: damaged
                quantity_delta: 1
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.details[0].field:
                - eq: lineItems.0.quantityDelta
      - name: rejects a zero quantity delta
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.locationId}}
            line_items:
              - variant_id: ${{captures.tangerinesVariantId}}
                reason: theft
                quantity_delta: 0
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects an unknown reason
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.locationId}}
            line_items:
              - variant_id: ${{captures.tangerinesVariantId}}
                reason: received
                quantity_delta: 5
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects a decrease below zero
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.locationId}}
            line_items:
              - variant_id: ${{captures.tangerinesVariantId}}
                reason: lost
                quantity_delta: -12
          check:
            status: 409
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: stock_insufficient
              $.details[0].message:
                - eq: Variant ${{captures.tangerinesVariantId}} is short by 1.
      - name: rejects a product whose opening stock was never set
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.locationId}}
            line_items:
              - variant_id: ${{captures.tabascoVariantId}}
                reason: correction
                quantity_delta: 5
                notes: Found a box
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects a missing location
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: loc_AGGD8EJA69JRL3UTU79K
            line_items:
              - variant_id: ${{captures.tangerinesVariantId}}
                reason: theft
                quantity_delta: -1
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: resource_not_found
      - name: rejected adjustments leave the stock unchanged
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.tangerinesId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            body:
              - eq: ${{captures.tangerinesAfterAdjustments}}
      - name: lists the variant's history newest first with the on-hand after each change
        http:
          url: ${{env.baseUrl}}/v1/inventory/changes?variant_ids=${{captures.tangerinesVariantId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/InventoryChangePaginationResponse"
            jsonpath:
              $.has_more:
                - eq: false
              $.results.length:
                - eq: 3
              $.results[0].id:
                - eq: ${{captures.correctionMovementId}}
              $.results[0].type:
                - eq: movement
              $.results[0].on_hand_after:
                - eq: 11
              $.results[0].notes:
                - eq: Found a crate behind the counter
              $.results[1].id:
                - eq: ${{captures.waterLeakMovementId}}
              $.results[1].on_hand_after:
                - eq: 9
              $.results[2].reason:
                - eq: initial_stock
              $.results[2].on_hand_after:
                - eq: 12
      - name: filters by reason with comma-separated values while keeping exact balances
        http:
          url: ${{env.baseUrl}}/v1/inventory/changes?variant_ids=${{captures.tangerinesVariantId}}&reasons=damaged,theft,lost
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/InventoryChangePaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 1
              $.results[0].id:
                - eq: ${{captures.waterLeakMovementId}}
              $.results[0].on_hand_after:
                - eq: 9
      - name: returns one change and a continuation cursor
        http:
          url: ${{env.baseUrl}}/v1/inventory/changes?variant_ids=${{captures.tangerinesVariantId}}&limit=1
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            jsonpath:
              $.has_more:
                - eq: true
              $.results[0].id:
                - eq: ${{captures.correctionMovementId}}
          captures:
            nextCursor:
              jsonpath: $.next_cursor
      - name: continues from the cursor without repeating the first change
        http:
          url: ${{env.baseUrl}}/v1/inventory/changes?variant_ids=${{captures.tangerinesVariantId}}&limit=1&cursor=${{captures.nextCursor}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            jsonpath:
              $.has_more:
                - eq: true
              $.results[0].id:
                - eq: ${{captures.waterLeakMovementId}}
              $.results[0].on_hand_after:
                - eq: 9
      - name: rejects an unknown reason filter
        http:
          url: ${{env.baseUrl}}/v1/inventory/changes?reasons=damaged,sunk
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects a reversed date range
        http:
          url: ${{env.baseUrl}}/v1/inventory/changes?from=2026-11-19T12:00:00Z&to=2026-11-19T11:00:00Z
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
  authentication:
    name: requires authentication on every Inventory endpoint
    steps:
      - name: POST /v1/inventory/adjustments rejects a missing bearer token
        http:
          url: ${{env.baseUrl}}/v1/inventory/adjustments
          method: POST
          json:
            location_id: loc_AGGD8EJA69JRL3UTU79K
            line_items:
              - variant_id: var_SPPWCBGNASKMHJSHXH38
                reason: theft
                quantity_delta: -1
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
      - name: GET /v1/inventory/changes rejects a missing bearer token
        http:
          url: ${{env.baseUrl}}/v1/inventory/changes
          method: GET
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
after:
  name: removes the inventory workflow products
  steps:
    - name: deletes the test products with their stock history
      plugin:
        id: ${{env.workflowFixtureDirectory}}/inventory.fixture.ts
