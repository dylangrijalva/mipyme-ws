version: "1.1"
name: Products API
components:
  schemas:
    Product:
      $ref: ./src/openapi.json#/components/schemas/Product
    ProductPaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/ProductPaginationResponse
    MipymeError:
      $ref: ./src/openapi.json#/components/schemas/MipymeError
    Merchant:
      $ref: ./src/openapi.json#/components/schemas/Merchant
config:
  concurrency: 1
before:
  name: provisions the authenticated account
  steps:
    - name: checks whether onboarding is required
      http:
        url: ${{env.baseUrl}}/v1/products
        method: GET
        auth:
          bearer:
            token: ${{env.token}}
        check:
          status:
            - match: ^(200|403)$
          schema:
            anyOf:
              - $ref: "#/components/schemas/ProductPaginationResponse"
              - allOf:
                  - $ref: "#/components/schemas/MipymeError"
                  - type: object
                    properties:
                      code:
                        const: account_not_provisioned
                      status:
                        const: 403
        captures:
          membershipError:
            jsonpath: $.code
    - name: completes onboarding
      http:
        url: ${{env.baseUrl}}/v1/onboarding
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
          phone: "+50588881234"
          pin: "1234"
          location:
            name: Merry's Shop
            business_type: electronics_store
        check:
          status: 200
          schema:
            $ref: "#/components/schemas/Merchant"
      if: captures.membershipError == "account_not_provisioned"
tests:
  lifecycle:
    name: creates, retrieves, paginates, and updates saved products
    steps:
      - name: creates a draft item with snake_case fields and a default variant
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "  Sanji's provisions  "
            price: "20.00"
            unit_cost: "10.00"
            sku: SANJI-PROVISIONS
            barcode: "100000000001"
            image_url: https://strawhatpirates.example.com/provisions.webp
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.name:
                - eq: Sanji's provisions
              $.price:
                - eq: "20.00"
              $.unit_cost:
                - eq: "10.00"
              $.product_type:
                - eq: item
              $.status:
                - eq: draft
              $.image_url:
                - eq: https://strawhatpirates.example.com/provisions.webp
              $.collection:
                - eq: null
              $.variants.length:
                - eq: 1
              $.variants[0].name:
                - eq: Sanji's provisions
              $.variants[0].price:
                - eq: "20.00"
              $.variants[0].sku:
                - eq: SANJI-PROVISIONS
              $.variants[0].barcode:
                - eq: "100000000001"
              $.variants[0].inventory_levels.length:
                - gt: 0
              $.variants[0].inventory_levels[0].on_hand:
                - eq: 0
              $.variants[0].inventory_levels[0].stock_status:
                - eq: not_stocked
          captures:
            itemId:
              jsonpath: $.id
            item:
              body: true
            slug:
              jsonpath: $.slug
      - name: fetches the saved item for the authenticated merchant
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.itemId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            body:
              - eq: ${{captures.item}}
      - name: creates an active service without a unit cost
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Nami's navigation
            price: "30.00"
            product_type: service
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.name:
                - eq: Nami's navigation
              $.unit_cost:
                - eq: "0.00"
              $.product_type:
                - eq: service
              $.status:
                - eq: active
              $.variants.length:
                - eq: 1
              $.variants[0].sku:
                - eq: null
              $.variants[0].barcode:
                - eq: null
          captures:
            serviceId:
              jsonpath: $.id
      - name: lists both saved products with default pagination
        http:
          url: ${{env.baseUrl}}/v1/products
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/ProductPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 2
              $.has_more:
                - eq: false
              $.next_cursor:
                - eq: null
              $.results[?(@.name == "Sanji's provisions")].id:
                - eq:
                    - ${{captures.itemId}}
              $.results[?(@.name == "Nami's navigation")].id:
                - eq:
                    - ${{captures.serviceId}}
      - name: returns one product and a continuation cursor
        http:
          url: ${{env.baseUrl}}/v1/products?limit=1
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/ProductPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 1
              $.has_more:
                - eq: true
              $.next_cursor:
                - isString: true
                - match: ^.+$
          captures:
            firstId:
              jsonpath: $.results[0].id
            cursor:
              jsonpath: $.next_cursor
      - name: returns the remaining product without repeating the first page
        http:
          url: ${{env.baseUrl}}/v1/products?limit=1&cursor=${{captures.cursor}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/ProductPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 1
              $.has_more:
                - eq: false
              $.next_cursor:
                - eq: null
              $.results[0].id:
                - ne: ${{captures.firstId}}
      - name: rejects a duplicate SKU
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Zoro's provisions
            price: "20.00"
            unit_cost: "10.00"
            sku: SANJI-PROVISIONS
          check:
            status: 409
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: sku_already_exists
              $.status:
                - eq: 409
      - name: rejects a duplicate barcode
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Zoro's provisions
            price: "20.00"
            unit_cost: "10.00"
            barcode: "100000000001"
          check:
            status: 409
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: barcode_already_exists
              $.status:
                - eq: 409
      - name: updates item fields while preserving omitted fields
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.itemId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Sanji's feast
            price: "25.00"
            unit_cost: "12.00"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.id:
                - eq: ${{captures.itemId}}
              $.name:
                - eq: Sanji's feast
              $.price:
                - eq: "25.00"
              $.unit_cost:
                - eq: "12.00"
              $.status:
                - eq: draft
              $.slug:
                - eq: ${{captures.slug}}
              $.image_url:
                - eq: https://strawhatpirates.example.com/provisions.webp
              $.variants[0].name:
                - eq: Sanji's feast
              $.variants[0].price:
                - eq: "25.00"
              $.variants[0].sku:
                - eq: SANJI-PROVISIONS
              $.variants[0].barcode:
                - eq: "100000000001"
          captures:
            updatedItem:
              body: true
      - name: reloads the persisted item update
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.itemId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            body:
              - eq: ${{captures.updatedItem}}
      - name: rejects an item price below its saved unit cost
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.itemId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Rejected feast
            price: "1.00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: price_below_unit_cost
              $.status:
                - eq: 400
      - name: rejects an invalid update payload
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.itemId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "   "
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: failed updates leave the saved item unchanged
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.itemId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            body:
              - eq: ${{captures.updatedItem}}
      - name: an empty patch returns the item unchanged
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.itemId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json: {}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            body:
              - eq: ${{captures.updatedItem}}
      - name: updates a service and synchronizes its default variant
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.serviceId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Nami's Grand Line navigation
            price: "40.00"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.id:
                - eq: ${{captures.serviceId}}
              $.name:
                - eq: Nami's Grand Line navigation
              $.price:
                - eq: "40.00"
              $.unit_cost:
                - eq: "0.00"
              $.status:
                - eq: active
              $.variants[0].name:
                - eq: Nami's Grand Line navigation
              $.variants[0].price:
                - eq: "40.00"
          captures:
            updatedService:
              body: true
      - name: reloads the persisted service update
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.serviceId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            body:
              - eq: ${{captures.updatedService}}
      - name: clears an image with an explicit null
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.itemId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            image_url: null
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.image_url:
                - eq: null
              $.name:
                - eq: Sanji's feast
              $.price:
                - eq: "25.00"
          captures:
            clearedItem:
              body: true
      - name: reloads the cleared image
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.itemId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            body:
              - eq: ${{captures.clearedItem}}
      - name: updating the item leaves the service unchanged
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.serviceId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            body:
              - eq: ${{captures.updatedService}}
      - name: failed creations did not add products
        http:
          url: ${{env.baseUrl}}/v1/products
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/ProductPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 2
  validation:
    name: rejects invalid requests and missing resources
    steps:
      - name: captures the catalog before rejected requests
        http:
          url: ${{env.baseUrl}}/v1/products
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/ProductPaginationResponse"
          captures:
            catalogBeforeInvalid:
              body: true
      - name: rejects a blank product name
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: " "
            price: "20.00"
            unit_cost: "10.00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects numeric prices instead of decimal strings
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Zoro's sword
            price: 20
            unit_cost: "10.00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: requires a unit cost for items
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Zoro's sword
            price: "20.00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects an item price below its unit cost
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Zoro's sword
            price: "9.00"
            unit_cost: "10.00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: price_below_unit_cost
              $.status:
                - eq: 400
      - name: rejects a missing collection
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Zoro's sword
            price: "20.00"
            unit_cost: "10.00"
            collection_id: coll_0000000000000000000
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: resource_not_found
              $.status:
                - eq: 404
      - name: rejects pagination limit 0
        http:
          url: ${{env.baseUrl}}/v1/products?limit=0
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects pagination limit 101
        http:
          url: ${{env.baseUrl}}/v1/products?limit=101
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: GET rejects an invalid product identifier
        http:
          url: ${{env.baseUrl}}/v1/products/invalid
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: GET rejects a missing product
        http:
          url: ${{env.baseUrl}}/v1/products/prod_0000000000000000000
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: resource_not_found
              $.status:
                - eq: 404
      - name: PATCH rejects an invalid product identifier
        http:
          url: ${{env.baseUrl}}/v1/products/invalid
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Zoro's sword
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: PATCH rejects a missing product
        http:
          url: ${{env.baseUrl}}/v1/products/prod_0000000000000000000
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Zoro's sword
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: resource_not_found
              $.status:
                - eq: 404
      - name: rejected requests leave the catalog unchanged
        http:
          url: ${{env.baseUrl}}/v1/products
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/ProductPaginationResponse"
            body:
              - eq: ${{captures.catalogBeforeInvalid}}
  authentication:
    name: requires authentication on every Products endpoint
    steps:
      - name: GET /v1/products rejects a missing bearer token
        http:
          url: ${{env.baseUrl}}/v1/products
          method: GET
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
      - name: POST /v1/products rejects a missing bearer token
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          json:
            name: Zoro's sword
            price: "20.00"
            unit_cost: "10.00"
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
      - name: PATCH /v1/products/{id} rejects a missing bearer token
        http:
          url: ${{env.baseUrl}}/v1/products/prod_0000000000000000000
          method: PATCH
          json:
            name: Zoro's sword
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
      - name: GET rejects a missing bearer token for a product
        http:
          url: ${{env.baseUrl}}/v1/products/prod_0000000000000000000
          method: GET
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
  inventory:
    name: sets opening stock and thresholds through inventory levels
    steps:
      - name: captures the onboarding location
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
          captures:
            locationId:
              jsonpath: $.results[0].id
      - name: creates an item with opening stock and thresholds
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Nami's mandarins
            price: "5.00"
            unit_cost: "2.00"
            inventory_levels:
              - location_id: ${{captures.locationId}}
                on_hand: 12
                low_stock_threshold: 3
                optimal_stock_level: 20
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.status:
                - eq: active
              $.variants[0].inventory_levels[?(@.on_hand > 0)].location_id:
                - eq:
                    - ${{captures.locationId}}
              $.variants[0].inventory_levels[?(@.on_hand > 0)].on_hand:
                - eq:
                    - 12
              $.variants[0].inventory_levels[?(@.on_hand > 0)].low_stock_threshold:
                - eq:
                    - 3
              $.variants[0].inventory_levels[?(@.on_hand > 0)].optimal_stock_level:
                - eq:
                    - 20
              $.variants[0].inventory_levels[?(@.stock_status == "in_stock")].location_id:
                - eq:
                    - ${{captures.locationId}}
              $.variants[0].inventory_levels[?(@.last_restock_at)].location_id:
                - eq:
                    - ${{captures.locationId}}
              $.variants[0].inventory_levels[?(@.last_inventory_adjustment_at)].location_id:
                - eq:
                    - ${{captures.locationId}}
          captures:
            mandarinsId:
              jsonpath: $.id
      - name: rejects opening stock once the item has an inventory movement
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.mandarinsId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            inventory_levels:
              - location_id: ${{captures.locationId}}
                on_hand: 5
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: updates a threshold after the opening stock while keeping stock and the other threshold
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.mandarinsId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            inventory_levels:
              - location_id: ${{captures.locationId}}
                low_stock_threshold: 5
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.variants[0].inventory_levels[?(@.on_hand > 0)].location_id:
                - eq:
                    - ${{captures.locationId}}
              $.variants[0].inventory_levels[?(@.on_hand > 0)].on_hand:
                - eq:
                    - 12
              $.variants[0].inventory_levels[?(@.on_hand > 0)].low_stock_threshold:
                - eq:
                    - 5
              $.variants[0].inventory_levels[?(@.on_hand > 0)].optimal_stock_level:
                - eq:
                    - 20
      - name: creates an item without stock
        http:
          url: ${{env.baseUrl}}/v1/products
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Usopp's pop greens
            price: "3.00"
            unit_cost: "1.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.status:
                - eq: draft
              $.variants[0].inventory_levels.length:
                - gte: 1
              $.variants[0].inventory_levels[?(@.on_hand > 0)]:
                - isDefined: false
              $.variants[0].inventory_levels[?(@.stock_status != "not_stocked")]:
                - isDefined: false
          captures:
            popGreensId:
              jsonpath: $.id
      - name: sets opening stock on an item without inventory movements
        http:
          url: ${{env.baseUrl}}/v1/products/${{captures.popGreensId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            inventory_levels:
              - location_id: ${{captures.locationId}}
                on_hand: 7
                low_stock_threshold: 2
                optimal_stock_level: 10
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Product"
            jsonpath:
              $.variants[0].inventory_levels[?(@.on_hand > 0)].location_id:
                - eq:
                    - ${{captures.locationId}}
              $.variants[0].inventory_levels[?(@.on_hand > 0)].on_hand:
