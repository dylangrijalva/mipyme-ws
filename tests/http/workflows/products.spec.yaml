                    - 7
              $.variants[0].inventory_levels[?(@.on_hand > 0)].low_stock_threshold:
                - eq:
                    - 2
              $.variants[0].inventory_levels[?(@.on_hand > 0)].optimal_stock_level:
                - eq:
                    - 10
              $.variants[0].inventory_levels[?(@.on_hand > 0)].stock_status:
                - eq:
                    - in_stock
              $.status:
