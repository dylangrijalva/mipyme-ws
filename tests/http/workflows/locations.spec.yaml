version: "1.1"
name: Locations API
components:
  schemas:
    Location:
      $ref: ./src/openapi.json#/components/schemas/Location
    LocationPaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/LocationPaginationResponse
    MipymeError:
      $ref: ./src/openapi.json#/components/schemas/MipymeError
    Merchant:
      $ref: ./src/openapi.json#/components/schemas/Merchant
config:
  concurrency: 1
before:
  name: provisions the authenticated account
  steps:
    - name: checks whether onboarding is required
      http:
        url: ${{env.baseUrl}}/v1/locations
        method: GET
        auth:
          bearer:
            token: ${{env.token}}
        check:
          status:
            - match: ^(200|403)$
          schema:
            anyOf:
              - $ref: "#/components/schemas/LocationPaginationResponse"
              - allOf:
                  - $ref: "#/components/schemas/MipymeError"
                  - type: object
                    properties:
                      code:
                        const: account_not_provisioned
                      status:
                        const: 403
        captures:
          membershipError:
            jsonpath: $.code
    - name: completes onboarding
      http:
        url: ${{env.baseUrl}}/v1/onboarding
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
          phone: "+50588881234"
          location:
            name: Merry's Shop
            business_type: electronics_store
        check:
          status: 200
          schema:
            $ref: "#/components/schemas/Merchant"
      if: captures.membershipError == "account_not_provisioned"
tests:
  lifecycle:
    name: creates and updates locations, preserving server-managed fields and the
      three-location limit
    steps:
      - name: starts with the location provisioned during onboarding
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/LocationPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 1
              $.has_more:
                - eq: false
          captures:
            onboardingId:
              jsonpath: $.results[0].id
      - name: creates a location with trimmed settings and decimal strings
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "  Water 7  "
            business_type: grocery_store
            address: "  Dock 1  "
            phone: "  50588888888  "
            tax_id: "  STRAWHAT  "
            tax_rate: "15"
            exchange_rate: "36.5"
            allow_backorders: true
            receipt_header_text: "  Straw Hat Pirates  "
            receipt_footer_text: "  Thank you  "
            next_sale_number: 99
            next_purchase_order_number: 99
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Location"
            jsonpath:
              $.name:
                - eq: Water 7
              $.business_type:
                - eq: grocery_store
              $.address:
                - eq: Dock 1
              $.phone:
                - eq: "50588888888"
              $.tax_id:
                - eq: STRAWHAT
              $.tax_rate:
                - eq: "15.00"
              $.exchange_rate:
                - eq: "36.50"
              $.allow_backorders:
                - eq: true
              $.receipt_header_text:
                - eq: Straw Hat Pirates
              $.receipt_footer_text:
                - eq: Thank you
              $.next_sale_number:
                - eq: 1
              $.next_purchase_order_number:
                - eq: 1
          captures:
            primaryId:
              jsonpath: $.id
            primary:
              body: true
            createdAt:
              jsonpath: $.created_at
      - name: reloads the persisted location
        http:
          url: ${{env.baseUrl}}/v1/locations/${{captures.primaryId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Location"
            body:
              - eq: ${{captures.primary}}
      - name: creates the third location with defaults and an idempotency key
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          headers:
            Idempotency-Key: locations-loguetown
          json:
            name: Loguetown
            business_type: other
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Location"
            jsonpath:
              $.name:
                - eq: Loguetown
              $.address:
                - eq: null
              $.tax_rate:
                - eq: "0.00"
              $.exchange_rate:
                - eq: "0.00"
              $.allow_backorders:
                - eq: false
              $.receipt_header_text:
                - eq: null
          captures:
            third:
              body: true
      - name: replays the successful creation even when the merchant is at its limit
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          headers:
            Idempotency-Key: locations-loguetown
          json:
            name: Loguetown
            business_type: other
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Location"
            body:
              - eq: ${{captures.third}}
      - name: rejects a fourth location
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Dressrosa
            business_type: other
          check:
            status: 403
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: location_limit_exceeded
              $.status:
                - eq: 403
      - name: lists exactly three locations after the rejected fourth creation
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/LocationPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 3
              $.has_more:
                - eq: false
              $.next_cursor:
                - eq: null
          captures:
            firstId:
              jsonpath: $.results[0].id
            secondId:
              jsonpath: $.results[1].id
            lastId:
              jsonpath: $.results[2].id
      - name: returns the first page in ID order
        http:
          url: ${{env.baseUrl}}/v1/locations?limit=1
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/LocationPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 1
              $.results[0].id:
                - eq: ${{captures.firstId}}
              $.has_more:
                - eq: true
              $.next_cursor:
                - eq: ${{captures.firstId}}
      - name: continues from the cursor without repeating the first location
        http:
          url: ${{env.baseUrl}}/v1/locations?limit=2&cursor=${{captures.firstId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/LocationPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 2
              $.results[0].id:
                - eq: ${{captures.secondId}}
              $.results[1].id:
                - eq: ${{captures.lastId}}
              $.has_more:
                - eq: false
              $.next_cursor:
                - eq: null
      - name: updates supplied fields while preserving omitted settings and counters
        http:
          url: ${{env.baseUrl}}/v1/locations/${{captures.primaryId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "  Dock 1  "
            business_type: hardware_store
            address: null
            phone: null
            tax_id: null
            tax_rate: null
            exchange_rate: "0"
            allow_backorders: false
            receipt_header_text: null
            receipt_footer_text: null
            next_sale_number: 99
            next_purchase_order_number: 99
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Location"
            jsonpath:
              $.name:
                - eq: Dock 1
              $.business_type:
                - eq: hardware_store
              $.address:
                - eq: null
              $.phone:
                - eq: null
              $.tax_id:
                - eq: null
              $.tax_rate:
                - eq: null
              $.exchange_rate:
                - eq: "0.00"
              $.allow_backorders:
                - eq: false
              $.receipt_header_text:
                - eq: null
              $.receipt_footer_text:
                - eq: null
              $.next_sale_number:
                - eq: 1
              $.next_purchase_order_number:
                - eq: 1
              $.created_at:
                - eq: ${{captures.createdAt}}
          captures:
            updated:
              body: true
      - name: reloads the saved changes
        http:
          url: ${{env.baseUrl}}/v1/locations/${{captures.primaryId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Location"
            body:
              - eq: ${{captures.updated}}
      - name: accepts an empty patch without changing timestamps
        http:
          url: ${{env.baseUrl}}/v1/locations/${{captures.primaryId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json: {}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Location"
            body:
              - eq: ${{captures.updated}}
  validation:
    name: rejects invalid location requests without changing persistence
    steps:
      - name: captures locations before invalid requests
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/LocationPaginationResponse"
          captures:
            beforeInvalid:
              body: true
            validationId:
              jsonpath: $.results[0].id
      - name: rejects missing name
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            business_type: other
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects missing business type
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Water 7
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects blank name
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "   "
            business_type: other
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects unknown business type
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Water 7
            business_type: pirate_ship
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects negative tax rate
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Water 7
            business_type: other
            tax_rate: "-1"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects numeric exchange rate
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Water 7
            business_type: other
            exchange_rate: 36.5
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects invalid decimal text
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Water 7
            business_type: other
            exchange_rate: berries
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects too many decimal places
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Water 7
            business_type: other
            tax_rate: "0.001"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects out of range rate
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Water 7
            business_type: other
            exchange_rate: "10000000000"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects null required field
        http:
          url: ${{env.baseUrl}}/v1/locations/${{captures.validationId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            business_type: null
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects blank receipt text
        http:
          url: ${{env.baseUrl}}/v1/locations/${{captures.validationId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            receipt_footer_text: "   "
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects null exchange rate
        http:
          url: ${{env.baseUrl}}/v1/locations/${{captures.validationId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            exchange_rate: null
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects invalid boolean
        http:
          url: ${{env.baseUrl}}/v1/locations/${{captures.validationId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            allow_backorders: "true"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects an invalid pagination limit
        http:
          url: ${{env.baseUrl}}/v1/locations?limit=0
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: GET rejects an invalid ID
        http:
          url: ${{env.baseUrl}}/v1/locations/invalid
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: GET rejects a missing location
        http:
          url: ${{env.baseUrl}}/v1/locations/loc_00000000000000000000
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: resource_not_found
              $.status:
                - eq: 404
      - name: PATCH rejects an invalid ID
        http:
          url: ${{env.baseUrl}}/v1/locations/invalid
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Water 7
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: PATCH rejects a missing location
        http:
          url: ${{env.baseUrl}}/v1/locations/loc_00000000000000000000
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Water 7
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: resource_not_found
              $.status:
                - eq: 404
      - name: all rejected requests leave the saved locations unchanged
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/LocationPaginationResponse"
            body:
              - eq: ${{captures.beforeInvalid}}
  authentication:
    name: requires authentication on every location endpoint
    steps:
      - name: GET / requires a token
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: GET
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
      - name: POST / requires a token
        http:
          url: ${{env.baseUrl}}/v1/locations
          method: POST
          json:
            name: Water 7
            business_type: other
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
      - name: GET /loc_00000000000000000000 requires a token
        http:
          url: ${{env.baseUrl}}/v1/locations/loc_00000000000000000000
          method: GET
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
      - name: PATCH /loc_00000000000000000000 requires a token
        http:
          url: ${{env.baseUrl}}/v1/locations/loc_00000000000000000000
          method: PATCH
          json:
            name: Water 7
            business_type: other
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
