version: "1.1"
name: Me API
tests:
  me:
    name: returns the authenticated user's claim
    steps:
      - name: sends a GET request to /me with a bearer token
        http:
          url: ${{env.baseUrl}}/me
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            jsonpath:
              $.sub:
                - eq: ${{env.testUserId}}
              $.email:
                - isString: true
                - match: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
  unauthenticated:
    name: rejects a missing bearer token with a traceable error
    steps:
      - name: sends a GET request to /me without a bearer token
        http:
          url: ${{env.baseUrl}}/me
          method: GET
          headers:
            X-Request-ID: req_me_missing_token
          check:
            status: 401
            headers:
              X-Request-ID: req_me_missing_token
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.request_id:
                - eq: req_me_missing_token
      - name: generates a request ID when the client does not send one
        http:
          url: ${{env.baseUrl}}/me
          method: GET
          check:
            status: 401
            headers:
              X-Request-ID:
                - match: ^req_[0-9A-Z]+$
            jsonpath:
              $.request_id:
                - match: ^req_[0-9A-Z]+$
