version: "1.1"
name: Me API
tests:
  me:
    name: returns the authenticated user's claim
    steps:
      - name: sends a GET request to /me with a bearer token
        http:
          url: ${{env.baseUrl}}/me
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            jsonpath:
              $.sub:
                - eq: ${{env.testUserId}}
              $.email:
                - isString: true
                - match: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
