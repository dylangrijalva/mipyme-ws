version: "1.1"
name: Onboarding API
tests:
  provision_account:
    name: "POST /v1/onboarding should return the created merchant"
    steps:
      - name: POST /v1/onboarding
        http:
          url: ${{env.baseUrl}}/v1/onboarding
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Monkey D. Luffy
            country: ni
            location:
              name: "  Merry's Shop  "
              business_type: electronics_store
          check:
            status: 200
            jsonpath:
              $.id:
                - isString: true
                - match: ^merch_.{18}$
              $.name:
                - eq: Merry's Shop
              $.country:
                - eq: ni
              $.created_at:
                - isString: true
              $.updated_at:
                - isString: true
          captures:
            merchant:
              body: true
      - name: returns the created merchant when the same request is repeated
        http:
          url: ${{env.baseUrl}}/v1/onboarding
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Monkey D. Luffy
            country: ni
            location:
              name: "  Merry's Shop  "
              business_type: electronics_store
          check:
            status: 200
            body:
              - eq: ${{captures.merchant}}
