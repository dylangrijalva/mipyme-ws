version: "1.1"
name: Account provisioning API
tests:
  provision_account:
    name: creates a merchant and returns it on retry
    steps:
      - name: creates a merchant from a trimmed location name
        http:
          url: ${{env.baseUrl}}/v1/onboarding
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "  Monkey D. Luffy  "
            country: ni
            location:
              name: "  Straw Hat Pirates  "
          check:
            status: 200
            jsonpath:
              $.id:
                - isString: true
              $.name:
                - eq: Straw Hat Pirates
              $.country:
                - eq: ni
              $.created_at:
                - isString: true
              $.updated_at:
                - isString: true
          captures:
            merchant:
              body: true
      - name: returns the same merchant response when repeated with different input
        http:
          url: ${{env.baseUrl}}/v1/onboarding
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Trafalgar Law
            country: cr
            location:
              name: Heart Pirates
              business_type: pharmacy
          check:
            status: 200
            body:
              - eq: ${{captures.merchant}}
