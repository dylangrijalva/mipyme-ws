version: "1.1"
name: Onboarding API
components:
  schemas:
    MipymeError:
      $ref: ./src/openapi.json#/components/schemas/MipymeError
tests:
  provision_account:
    name: "POST /v1/onboarding should return the created merchant"
    steps:
      - name: rejects a phone number that is not in E.164 format
        http:
          url: ${{env.baseUrl}}/v1/onboarding
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Monkey D. Luffy
            phone: 201 555 0100
            location:
              name: Merry's Shop
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects a request without a phone number
        http:
          url: ${{env.baseUrl}}/v1/onboarding
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Monkey D. Luffy
            location:
              name: Merry's Shop
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
      - name: rejects a phone number from an unsupported country
        http:
          url: ${{env.baseUrl}}/v1/onboarding
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Monkey D. Luffy
            phone: "+593987654321"
            location:
              name: Merry's Shop
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.details[0].field:
                - eq: phone
      - name: POST /v1/onboarding
        http:
          url: ${{env.baseUrl}}/v1/onboarding
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Monkey D. Luffy
            phone: "+50588881234"
            location:
              name: "  Merry's Shop  "
              business_type: electronics_store
          check:
            status: 200
            jsonpath:
              $.id:
                - isString: true
                - match: ^merch_.{18}$
              $.name:
                - eq: Merry's Shop
              $.country:
                - eq: ni
              $.created_at:
                - isString: true
              $.updated_at:
                - isString: true
          captures:
            merchant:
              body: true
      - name: returns the created merchant when the same request is repeated
        http:
          url: ${{env.baseUrl}}/v1/onboarding
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Monkey D. Luffy
            phone: "+50588881234"
            location:
              name: "  Merry's Shop  "
              business_type: electronics_store
          check:
            status: 200
            body:
              - eq: ${{captures.merchant}}
