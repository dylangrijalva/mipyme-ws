version: "1.1"
name: Purchases API
components:
  schemas:
    Purchase:
      $ref: ./src/openapi.json#/components/schemas/Purchase
    PurchasePaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/PurchasePaginationResponse
    MipymeError:
      $ref: ./src/openapi.json#/components/schemas/MipymeError
config:
  concurrency: 1
before:
  name: prepares purchase scenario data
  steps:
    - name: seeds purchase records
      plugin:
        id: ${{env.workflowFixtureDirectory}}/purchases.fixture.ts
        params:
          action: setup
tests:
  reads:
    name: reads complete purchases through the public HTTP contract
    steps:
      - name: "retrieves a voided purchase with its supplier and item snapshots"
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.purchaseId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Purchase"
            jsonpath:
              $.id: ${{captures.purchaseId}}
              $.status: voided
              $.supplier.id: ${{captures.purchaseSupplierId}}
              $.line_items.length: 1
              $.line_items[0].unit_cost: "10.00"
              $.line_items[0].price: "20.00"
              $.line_items[0].variants[0].id: ${{captures.purchaseVariantId}}
              $.line_items[0].variants[0].quantity: 2
      - name: "applies snake case filters and inclusive microsecond date bounds"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            location_id: "${{captures.purchaseLocationId}}"
            supplier_id: "${{captures.purchaseSupplierId}}"
            status: "voided"
            from: "2026-10-10T12:30:00.123456-06:00"
            to: "2026-10-10T18:30:00.123456Z"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/PurchasePaginationResponse"
            jsonpath:
              $.results.length: 1
              $.results[0].id: ${{captures.purchaseId}}
              $.results[0].line_items[0].variants[0].id: ${{captures.purchaseVariantId}}
              $.has_more: false
              $.next_cursor: null
      - name: "requests the first purchase page"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "1"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/PurchasePaginationResponse"
            jsonpath:
              $.results.length: 1
              $.results[0].id: ${{captures.newestPurchaseId}}
              $.has_more: true
          captures:
            page1Cursor:
              jsonpath: $.next_cursor
      - name: "follows the returned purchase cursor"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "1"
            cursor: "${{captures.page1Cursor}}"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/PurchasePaginationResponse"
            jsonpath:
              $.results.length: 1
              $.results[0].id: ${{captures.purchaseId}}
              $.has_more: true
      - name: "rejects invalid input ID"
        http:
          url: ${{env.baseUrl}}/v1/purchases/not-an-id
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'limit': 0}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "0"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'limit': 101}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "101"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'status': 'pending'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            status: "pending"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'supplier_id': 'Baratie'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            supplier_id: "Baratie"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'location_id': 'Water7'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            location_id: "Water7"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'cursor': 'not-a-cursor'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            cursor: "not-a-cursor"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'from': '2026-10-10T18:30:00'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            from: "2026-10-10T18:30:00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'from': '2026-02-30T00:00:00Z'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            from: "2026-02-30T00:00:00Z"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'from': '2026-10-10T18:30:00.1234562Z', 'to': '2026-10-10T18:30:00.1234561Z'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            from: "2026-10-10T18:30:00.1234562Z"
            to: "2026-10-10T18:30:00.1234561Z"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: "hides a missing or foreign purchase"
        http:
          url: ${{env.baseUrl}}/v1/purchases/purc_0000000000000000000
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: resource_not_found
      - name: "hides a missing or foreign purchase"
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.foreignPurchaseId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: resource_not_found
      - name: "requires authentication"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          check:
            status: 401
            jsonpath:
              $.code: invalid_oauth_token
      - name: "requires authentication"
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.purchaseId}}
          method: GET
          check:
            status: 401
            jsonpath:
              $.code: invalid_oauth_token
  voids:
    name: voids purchases through the public HTTP contract
    steps:
      - name: creates a purchase with a saved previous cost
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.purchaseLocationId}}
            supplier_id: ${{captures.purchaseSupplierId}}
            line_items:
              - variant_id: ${{captures.purchaseVariantId}}
                quantity: 2
                unit_cost: "12.00"
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Purchase"
            jsonpath:
              $.status: fulfilled
              $.voided_at: null
          captures:
            purchaseToVoid:
              jsonpath: $.id
      - name: rejects a non-string reason before changing the purchase
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.purchaseToVoid}}/void
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            reason: 75
          check:
            status: 400
            jsonpath:
              $.code: validation_error
      - name: voids the purchase and records its trimmed reason and actor
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.purchaseToVoid}}/void
          method: POST
          headers:
            Idempotency-Key: nami-purchase-void
          auth:
            bearer:
              token: ${{env.token}}
          json:
            reason: "  Wrong supplier delivery  "
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Purchase"
            jsonpath:
              $.status: voided
              $.void_reason: Wrong supplier delivery
              $.voided_by.id: ${{captures.purchaseEmployeeId}}
              $.line_items[0].variants[0].quantity: 2
          captures:
            originalVoidedAt:
              jsonpath: $.voided_at
      - name: replays the idempotent response without reversing stock twice
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.purchaseToVoid}}/void
          method: POST
          headers:
            Idempotency-Key: nami-purchase-void
          auth:
            bearer:
              token: ${{env.token}}
          json:
            reason: "  Wrong supplier delivery  "
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Purchase"
            jsonpath:
              $.voided_at: ${{captures.originalVoidedAt}}
              $.void_reason: Wrong supplier delivery
      - name: keeps the original audit details on a new void request
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.purchaseToVoid}}/void
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            reason: "   "
          check:
            status: 200
            jsonpath:
              $.voided_at: ${{captures.originalVoidedAt}}
              $.void_reason: Wrong supplier delivery
      - name: retrieves persisted void metadata
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.purchaseToVoid}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Purchase"
            jsonpath:
              $.voided_at: ${{captures.originalVoidedAt}}
              $.voided_by.id: ${{captures.purchaseEmployeeId}}
      - name: creates an earlier purchase that will be blocked
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.purchaseLocationId}}
            supplier_id: ${{captures.purchaseSupplierId}}
            line_items:
              - variant_id: ${{captures.purchaseVariantId}}
                quantity: 2
                unit_cost: "12.00"
          check:
            status: 201
          captures:
            earlierPurchase:
              jsonpath: $.id
      - name: makes a later purchase of the same product
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            location_id: ${{captures.purchaseLocationId}}
            supplier_id: ${{captures.purchaseSupplierId}}
            line_items:
              - variant_id: ${{captures.purchaseVariantId}}
                quantity: 1
                unit_cost: "14.00"
          check:
            status: 201
          captures:
            laterPurchase:
              jsonpath: $.id
      - name: rejects voiding the earlier purchase after another inventory change
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.earlierPurchase}}/void
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/MipymeError"
            jsonpath:
              $.code: validation_error
      - name: voids the latest purchase without a request body
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.laterPurchase}}/void
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Purchase"
            jsonpath:
              $.status: voided
              $.void_reason: null
      - name: keeps the earlier purchase blocked after the later purchase is voided
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.earlierPurchase}}/void
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            jsonpath:
              $.code: validation_error
      - name: rejects a legacy purchase without cost snapshots
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.secondPurchaseId}}/void
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            jsonpath:
              $.code: validation_error
      - name: hides purchases belonging to another merchant
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.foreignPurchaseId}}/void
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 404
            jsonpath:
              $.code: resource_not_found
      - name: validates the purchase identifier
        http:
          url: ${{env.baseUrl}}/v1/purchases/not-an-id/void
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            jsonpath:
              $.code: validation_error
      - name: requires authentication to void a purchase
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{captures.purchaseToVoid}}/void
          method: POST
          check:
            status: 401
            jsonpath:
              $.code: invalid_oauth_token
after:
  name: verifies and removes purchase scenario data
  steps:
    - name: verifies the purchase fixture and cleans it up
      plugin:
        id: ${{env.workflowFixtureDirectory}}/purchases.fixture.ts
        params:
          action: cleanup
