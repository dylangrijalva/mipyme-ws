version: "1.1"
name: Purchases API
components:
  schemas:
    Purchase:
      $ref: ./src/openapi.json#/components/schemas/Purchase
    PurchasePaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/PurchasePaginationResponse
    FacilitoError:
      $ref: ./src/openapi.json#/components/schemas/FacilitoError
config:
  concurrency: 1
tests:
  reads:
    name: reads complete purchases through the public HTTP contract
    steps:
      - name: "retrieves a voided purchase with its supplier and item snapshots"
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{env.purchaseId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Purchase"
            jsonpath:
              $.id: ${{env.purchaseId}}
              $.status: voided
              $.supplier.id: ${{env.purchaseSupplierId}}
              $.line_items.length: 1
              $.line_items[0].unit_cost: "10.00"
              $.line_items[0].price: "20.00"
              $.line_items[0].variants[0].id: ${{env.purchaseVariantId}}
              $.line_items[0].variants[0].quantity: 2
      - name: "applies snake case filters and inclusive microsecond date bounds"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            location_id: "${{env.purchaseLocationId}}"
            supplier_id: "${{env.purchaseSupplierId}}"
            status: "voided"
            from: "2026-10-10T12:30:00.123456-06:00"
            to: "2026-10-10T18:30:00.123456Z"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/PurchasePaginationResponse"
            jsonpath:
              $.results.length: 1
              $.results[0].id: ${{env.purchaseId}}
              $.results[0].line_items[0].variants[0].id: ${{env.purchaseVariantId}}
              $.has_more: false
              $.next_cursor: null
      - name: "retrieves page 1 across timestamp ties"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "1"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/PurchasePaginationResponse"
            jsonpath:
              $.results.length: 1
              $.results[0].id: ${{env.newestPurchaseId}}
              $.has_more: true
          captures:
            page1Cursor:
              jsonpath: $.next_cursor
      - name: "retrieves page 2 across timestamp ties"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "1"
            cursor: "${{captures.page1Cursor}}"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/PurchasePaginationResponse"
            jsonpath:
              $.results.length: 1
              $.results[0].id: ${{env.purchaseId}}
              $.has_more: true
          captures:
            page2Cursor:
              jsonpath: $.next_cursor
      - name: "retrieves page 3 across timestamp ties"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "1"
            cursor: "${{captures.page2Cursor}}"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/PurchasePaginationResponse"
            jsonpath:
              $.results.length: 1
              $.results[0].id: ${{env.secondPurchaseId}}
              $.has_more: true
          captures:
            page3Cursor:
              jsonpath: $.next_cursor
      - name: "retrieves page 4 across timestamp ties"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "1"
            cursor: "${{captures.page3Cursor}}"
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/PurchasePaginationResponse"
            jsonpath:
              $.results.length: 1
              $.results[0].id: ${{env.oldestPurchaseId}}
              $.has_more: false
              $.next_cursor: null
      - name: "rejects invalid input ID"
        http:
          url: ${{env.baseUrl}}/v1/purchases/not-an-id
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'limit': 0}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "0"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'limit': 101}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            limit: "101"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'status': 'pending'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            status: "pending"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'supplier_id': 'Baratie'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            supplier_id: "Baratie"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'location_id': 'Water7'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            location_id: "Water7"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'cursor': 'not-a-cursor'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            cursor: "not-a-cursor"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'from': '2026-10-10T18:30:00'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            from: "2026-10-10T18:30:00"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'from': '2026-02-30T00:00:00Z'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            from: "2026-02-30T00:00:00Z"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "rejects invalid input {'from': '2026-10-10T18:30:00.1234562Z', 'to': '2026-10-10T18:30:00.1234561Z'}"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          params:
            from: "2026-10-10T18:30:00.1234562Z"
            to: "2026-10-10T18:30:00.1234561Z"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: validation_error
      - name: "hides a missing or foreign purchase"
        http:
          url: ${{env.baseUrl}}/v1/purchases/purc_0000000000000000000
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: resource_not_found
      - name: "hides a missing or foreign purchase"
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{env.foreignPurchaseId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code: resource_not_found
      - name: "requires authentication"
        http:
          url: ${{env.baseUrl}}/v1/purchases
          method: GET
          check:
            status: 401
            jsonpath:
              $.code: invalid_oauth_token
      - name: "requires authentication"
        http:
          url: ${{env.baseUrl}}/v1/purchases/${{env.purchaseId}}
          method: GET
          check:
            status: 401
            jsonpath:
              $.code: invalid_oauth_token
