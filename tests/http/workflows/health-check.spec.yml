version: "1.1"
name: Health Check API
description: Checks the health of the API by sending a GET request to the /health endpoint and verifying the response.
tests:
  health_check:
    name: Health endpoint responds with 204 No Content
    steps:
      - name: send GET request to /_health endpoint
        http:
          url: ${{env.baseUrl}}/_health
          method: GET
          check:
            status: 204
