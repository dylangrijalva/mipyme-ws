version: "1.1"
name: Collections API
components:
  schemas:
    Collection:
      $ref: ./src/openapi.json#/components/schemas/Collection
    CollectionPaginationResponse:
      $ref: ./src/openapi.json#/components/schemas/CollectionPaginationResponse
    FacilitoError:
      $ref: ./src/openapi.json#/components/schemas/FacilitoError
    Merchant:
      $ref: ./src/openapi.json#/components/schemas/Merchant
config:
  concurrency: 1
before:
  name: provisions the authenticated account
  steps:
    - name: checks whether onboarding is required
      http:
        url: ${{env.baseUrl}}/v1/collections
        method: GET
        auth:
          bearer:
            token: ${{env.token}}
        check:
          status:
            - match: ^(200|403)$
          schema:
            anyOf:
              - $ref: "#/components/schemas/CollectionPaginationResponse"
              - allOf:
                  - $ref: "#/components/schemas/FacilitoError"
                  - type: object
                    properties:
                      code:
                        const: account_not_provisioned
                      status:
                        const: 403
        captures:
          membershipError:
            jsonpath: $.code
    - name: completes onboarding
      http:
        url: ${{env.baseUrl}}/v1/onboarding
        method: POST
        auth:
          bearer:
            token: ${{env.token}}
        json:
          name: Monkey D. Luffy
          country: ni
          location:
            name: Merry's Shop
            business_type: electronics_store
        check:
          status: 200
          schema:
            $ref: "#/components/schemas/Merchant"
      if: captures.membershipError == "account_not_provisioned"
tests:
  lifecycle:
    name: creates, retrieves, paginates, and updates saved collections
    steps:
      - name: returns an empty terminal page before records are created
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/CollectionPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 0
              $.has_more:
                - eq: false
              $.next_cursor:
                - eq: null
      - name: creates a collection with trimmed fields
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "  Water 7  "
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Collection"
            jsonpath:
              $.name:
                - eq: Water 7
              $.slug:
                - eq: water-7
          captures:
            primaryId:
              jsonpath: $.id
            primary:
              body: true
            createdAt:
              jsonpath: $.created_at
      - name: fetches the saved collection
        http:
          url: ${{env.baseUrl}}/v1/collections/${{captures.primaryId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Collection"
            body:
              - eq: ${{captures.primary}}
      - name: creates a second collection
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Alabasta
          check:
            status: 201
            schema:
              $ref: "#/components/schemas/Collection"
            jsonpath:
              $.name:
                - eq: Alabasta
              $.slug:
                - eq: alabasta
          captures:
            secondaryId:
              jsonpath: $.id
            secondary:
              body: true
      - name: lists both saved records with default pagination
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/CollectionPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 2
              $.has_more:
                - eq: false
              $.next_cursor:
                - eq: null
              $.results[?(@.name == "Water 7")].id:
                - eq:
                    - ${{captures.primaryId}}
              $.results[?(@.name == "Alabasta")].id:
                - eq:
                    - ${{captures.secondaryId}}
          captures:
            firstListedId:
              jsonpath: $.results[0].id
            secondListedId:
              jsonpath: $.results[1].id
      - name: returns the first record and a continuation cursor
        http:
          url: ${{env.baseUrl}}/v1/collections?limit=1
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/CollectionPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 1
              $.results[0].id:
                - eq: ${{captures.firstListedId}}
              $.has_more:
                - eq: true
              $.next_cursor:
                - isString: true
                - match: ^.+$
          captures:
            cursor:
              jsonpath: $.next_cursor
      - name: returns the remaining record on the final page
        http:
          url: ${{env.baseUrl}}/v1/collections?limit=1&cursor=${{captures.cursor}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/CollectionPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 1
              $.results[0].id:
                - eq: ${{captures.secondListedId}}
              $.has_more:
                - eq: false
              $.next_cursor:
                - eq: null
      - name: rejects a name that normalizes to an existing slug
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "  WATER 7  "
          check:
            status: 409
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: collection_name_already_exists
              $.status:
                - eq: 409
      - name: rejects renaming a collection to another existing slug
        http:
          url: ${{env.baseUrl}}/v1/collections/${{captures.primaryId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "  ALABASTA  "
          check:
            status: 409
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: collection_name_already_exists
              $.status:
                - eq: 409
      - name: a conflicting rename leaves the saved collection unchanged
        http:
          url: ${{env.baseUrl}}/v1/collections/${{captures.primaryId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Collection"
            body:
              - eq: ${{captures.primary}}
      - name: renames a collection and regenerates its slug
        http:
          url: ${{env.baseUrl}}/v1/collections/${{captures.primaryId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "  Wano Country  "
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Collection"
            jsonpath:
              $.id:
                - eq: ${{captures.primaryId}}
              $.name:
                - eq: Wano Country
              $.created_at:
                - eq: ${{captures.createdAt}}
              $.slug:
                - eq: wano-country
          captures:
            updated:
              body: true
      - name: reloads the persisted update
        http:
          url: ${{env.baseUrl}}/v1/collections/${{captures.primaryId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Collection"
            body:
              - eq: ${{captures.updated}}
      - name: rejects an invalid update without changing the record
        http:
          url: ${{env.baseUrl}}/v1/collections/${{captures.primaryId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "   "
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: the rejected update leaves the saved record unchanged
        http:
          url: ${{env.baseUrl}}/v1/collections/${{captures.primaryId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Collection"
            body:
              - eq: ${{captures.updated}}
      - name: an empty patch leaves fields and timestamps unchanged
        http:
          url: ${{env.baseUrl}}/v1/collections/${{captures.primaryId}}
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json: {}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Collection"
            body:
              - eq: ${{captures.updated}}
      - name: updates leave the other record unchanged
        http:
          url: ${{env.baseUrl}}/v1/collections/${{captures.secondaryId}}
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/Collection"
            body:
              - eq: ${{captures.secondary}}
      - name: the lifecycle leaves exactly two saved records
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/CollectionPaginationResponse"
            jsonpath:
              $.results.length:
                - eq: 2
  validation:
    name: rejects invalid requests and missing resources
    steps:
      - name: captures saved records before rejected requests
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/CollectionPaginationResponse"
          captures:
            recordsBeforeInvalid:
              body: true
      - name: rejects a blank name
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "   "
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects a missing required name
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json: {}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects a name that cannot produce a slug
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: POST
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: "!!!"
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects pagination limit 0
        http:
          url: ${{env.baseUrl}}/v1/collections?limit=0
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: rejects pagination limit 101
        http:
          url: ${{env.baseUrl}}/v1/collections?limit=101
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: GET rejects an invalid resource identifier
        http:
          url: ${{env.baseUrl}}/v1/collections/invalid
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: GET rejects a missing resource
        http:
          url: ${{env.baseUrl}}/v1/collections/coll_0000000000000000000
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: resource_not_found
              $.status:
                - eq: 404
      - name: PATCH rejects an invalid resource identifier
        http:
          url: ${{env.baseUrl}}/v1/collections/invalid
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Alabasta
          check:
            status: 400
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: validation_error
              $.status:
                - eq: 400
      - name: PATCH rejects a missing resource
        http:
          url: ${{env.baseUrl}}/v1/collections/coll_0000000000000000000
          method: PATCH
          auth:
            bearer:
              token: ${{env.token}}
          json:
            name: Alabasta
          check:
            status: 404
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: resource_not_found
              $.status:
                - eq: 404
      - name: rejected requests leave saved records unchanged
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: GET
          auth:
            bearer:
              token: ${{env.token}}
          check:
            status: 200
            schema:
              $ref: "#/components/schemas/CollectionPaginationResponse"
            body:
              - eq: ${{captures.recordsBeforeInvalid}}
  authentication:
    name: requires authentication on every collection endpoint
    steps:
      - name: GET /v1/collections requires a bearer token
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: GET
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
      - name: POST /v1/collections requires a bearer token
        http:
          url: ${{env.baseUrl}}/v1/collections
          method: POST
          json:
            name: Water 7
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
      - name: GET /v1/collections/{id} requires a bearer token
        http:
          url: ${{env.baseUrl}}/v1/collections/coll_0000000000000000000
          method: GET
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
      - name: PATCH /v1/collections/{id} requires a bearer token
        http:
          url: ${{env.baseUrl}}/v1/collections/coll_0000000000000000000
          method: PATCH
          json:
            name: Wano Country
          check:
            status: 401
            schema:
              $ref: "#/components/schemas/FacilitoError"
            jsonpath:
              $.code:
                - eq: invalid_oauth_token
              $.status:
                - eq: 401
